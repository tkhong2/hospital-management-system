version: '3.8'

services:
  # ========================================================
  # Infrastructure
  # ========================================================

  postgres:
    image: postgres:16-alpine
    container_name: hospitalms-prod-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./deploy/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hospitalms-prod-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: hospitalms-prod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  seq:
    image: datalust/seq:latest
    container_name: hospitalms-prod-seq
    restart: unless-stopped
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-prod-data:/data
    networks:
      - hospitalms-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ========================================================
  # Core Microservices
  # ========================================================

  identity-api:
    build:
      context: ./backend
      dockerfile: src/Services/Identity/HospitalMS.Identity.API/Dockerfile
    container_name: hospitalms-prod-identity
    restart: unless-stopped
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_identity;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Redis__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  patient-api:
    build:
      context: ./backend
      dockerfile: src/Services/Patient/HospitalMS.Patient.API/Dockerfile
    container_name: hospitalms-prod-patient
    restart: unless-stopped
    ports:
      - "5102:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_patient;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  catalog-api:
    build:
      context: ./backend
      dockerfile: src/Services/Catalog/HospitalMS.Catalog.API/Dockerfile
    container_name: hospitalms-prod-catalog
    restart: unless-stopped
    ports:
      - "5103:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_catalog;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Redis__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  outpatient-api:
    build:
      context: ./backend
      dockerfile: src/Services/Outpatient/HospitalMS.Outpatient.API/Dockerfile
    container_name: hospitalms-prod-outpatient
    restart: unless-stopped
    ports:
      - "5104:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_outpatient;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  inpatient-api:
    build:
      context: ./backend
      dockerfile: src/Services/Inpatient/HospitalMS.Inpatient.API/Dockerfile
    container_name: hospitalms-prod-inpatient
    restart: unless-stopped
    ports:
      - "5105:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_inpatient;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  pharmacy-api:
    build:
      context: ./backend
      dockerfile: src/Services/Pharmacy/HospitalMS.Pharmacy.API/Dockerfile
    container_name: hospitalms-prod-pharmacy
    restart: unless-stopped
    ports:
      - "5106:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_pharmacy;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  healthexam-api:
    build:
      context: ./backend
      dockerfile: src/Services/HealthExam/HospitalMS.HealthExam.API/Dockerfile
    container_name: hospitalms-prod-healthexam
    restart: unless-stopped
    ports:
      - "5107:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_healthexam;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ========================================================
  # API Gateway (YARP Reverse Proxy)
  # ========================================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: src/ApiGateway/HospitalMS.ApiGateway/Dockerfile
    container_name: hospitalms-prod-gateway
    restart: unless-stopped
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    depends_on:
      - identity-api
      - patient-api
      - catalog-api
      - outpatient-api
      - inpatient-api
      - pharmacy-api
      - healthexam-api
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ========================================================
  # Frontend Portal (Vue 3 + Nginx)
  # ========================================================

  frontend-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalms-prod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - hospitalms-prod-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  hospitalms-prod-network:
    driver: bridge

volumes:
  postgres-prod-data:
  redis-prod-data:
  seq-prod-data:

