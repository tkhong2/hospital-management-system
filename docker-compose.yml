  api-gateway:
    build:
      context: ./backend
      dockerfile: src/ApiGateway/HospitalMS.ApiGateway/Dockerfile
    container_name: hospitalms-api-gateway
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      identity-api:
        condition: service_healthy
      patient-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      outpatient-api:
        condition: service_healthy
      inpatient-api:
        condition: service_healthy
      pharmacy-api:
        condition: service_healthy
      healthexam-api:
        condition: service_healthy
    networks:
      - hospitalms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalms-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - hospitalms-network

volumes:
  postgres-data:
  redis-data:
  seq-data:
  pgadmin-data:

networks:
  hospitalms-network:
    driver: bridge
