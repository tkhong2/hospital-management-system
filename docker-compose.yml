      dockerfile: src/Services/Inpatient/HospitalMS.Inpatient.API/Dockerfile
    container_name: hospitalms-inpatient-api
    ports:
      - "5105:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hospitalms_inpatient;Username=postgres;Password=postgres123
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
