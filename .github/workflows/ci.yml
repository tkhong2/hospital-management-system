name: HospitalMS CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/HospitalMS.sln

      - name: Build solution (Release)
        run: dotnet build backend/HospitalMS.sln --no-restore -c Release

      - name: Run unit & integration tests
        run: dotnet test backend/HospitalMS.sln --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"

  frontend-ci:
    name: Frontend Build & Type Check (Vue 3 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check and production build
        working-directory: frontend
        run: npm run build

